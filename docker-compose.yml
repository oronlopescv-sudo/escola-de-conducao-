services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-escolaconducao}
      POSTGRES_USER: mysqlescola
      POSTGRES_DB: ESCOLA
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mysqlescola -d ESCOLA -h localhost"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://mysqlescola:${DB_PASSWORD:-escolaconducao}@db:5432/ESCOLA?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env}
    ports:
      - "3000:3000"

volumes:
  pgdata:
